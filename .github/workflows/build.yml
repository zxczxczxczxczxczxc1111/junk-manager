name: Сборка Windows
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Исходный код
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Собрать приложение и тестовый проект
        shell: pwsh
        run: dotnet build JunkManager.slnx -c Release
      - name: Собрать переносимые EXE
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Сохранить сборку
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junk-manager-windows-x64
          path: |
            artifacts/publish/JunkManager.exe
            artifacts/publish/JunkManager.Cli.exe
            artifacts/publish/LICENSE
            artifacts/publish/THIRD_PARTY_NOTICES.txt
            artifacts/publish/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14
